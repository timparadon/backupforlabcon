services:
    db:
      image: mysql:8
      environment:
        MYSQL_ROOT_PASSWORD: root
        MYSQL_DATABASE: app_db
      ports:
        - "3306:3306"
      volumes:
        - mysqldata:/var/lib/mysql

    phpmyadmin:
      image: phpmyadmin
      ports:
        - "8080:80"
      environment:
        PMA_HOST: db
        PMA_USER: root
        PMA_PASSWORD: root
      depends_on:
        - db

    backend:
      build: ./backend
      ports:
        - "3000:3000"
      environment:
        DB_HOST: db
        DB_USER: root
        DB_PASSWORD: root
        JWT_SECRET: secret123
      depends_on:
        - db

    frontend:
      build: ./font
      ports:
        - "5173:80"
      depends_on:
        - backend

volumes:
  mysqldata: